name: 音声を作って配信

on:
  push:
    paths:
      - "episodes/**"
  schedule:
    # 保険：Claude の push で起動しなかった場合に拾う（JST 7:40 / 8:40）
    - cron: "40 22 * * *"
    - cron: "40 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-episode
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 全ブランチを取得
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

      - name: ffmpeg を用意
        run: which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: 台本を音声化して公開
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/build_episode.py --delete-branches

      - name: フィードを保存
        run: |
          git config user.name "podcast-bot"
          git config user.email "podcast-bot@users.noreply.github.com"
          git add docs episodes
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "放送を更新 $(TZ=Asia/Tokyo date +%F)"
            git push origin main
          fi
